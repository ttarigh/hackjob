<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <title>Dennis's Gut Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ede0d0;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 24px 0;
      position: relative;
      overflow: hidden;
    }

    /* Wordmark Header with smooth subtle wiggle */
    .wordmark-wrapper {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wordmark-img {
      width: 220px;
      max-width: 65vw;
      height: auto;
      display: block;
      user-select: none;
      filter: url(#wiggle-filter);
      will-change: filter;
    }

    /* Main Section */
    .main-section {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    /* Subtle infrequent blinking timestamp: italics, monospace, light red */
    .timestamp {
      font-family: 'Space Mono', "SF Mono", Monaco, Menlo, "Roboto Mono", Consolas, monospace;
      font-style: italic;
      font-size: 14px;
      font-weight: 400;
      color: #e25858;
      margin-bottom: 6px;
      text-align: left;
      animation: subtle-blink 9s ease-in-out infinite;
      letter-spacing: -0.01em;
    }

    @keyframes subtle-blink {

      0%,
      84%,
      100% {
        opacity: 1;
      }

      88% {
        opacity: 0.25;
      }

      91% {
        opacity: 0.95;
      }

      94% {
        opacity: 0.35;
      }

      97% {
        opacity: 1;
      }
    }

    /* Toilet Image Box */
    .toilet-box {
      width: 100%;
      height: 380px;
      background-color: #d9d9d9;
      position: relative;
      overflow: hidden;
    }

    .toilet-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1);
      transform-origin: 50% 85%;
      transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .container.active .toilet-img {
      transform: scale(2.1);
    }

    /* Dialogue Card Overlay on Toilet View */
    .dialogue-card {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      background: rgba(237, 224, 208, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid #000000;
      padding: 12px 14px;
      z-index: 8;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .container.active .dialogue-card {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .dialogue-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      background-color: #e25858;
      border-radius: 50%;
      display: inline-block;
      animation: pulse-glow 1.2s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.85);
      }
    }

    .status-label {
      font-family: 'Space Mono', monospace;
      font-style: italic;
      font-size: 12px;
      color: #e25858;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .dialogue-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .user-transcript {
      font-family: 'Space Mono', monospace;
      font-style: italic;
      font-size: 13px;
      color: #555555;
      line-height: 1.35;
      word-break: break-word;
      min-height: 20px;
    }

    .gut-response {
      font-family: 'Space Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #000000;
      line-height: 1.35;
      word-break: break-word;
      display: none;
    }

    .gut-response.visible {
      display: block;
    }

    .dialogue-footer {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #777777;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    /* Speaking wobbles */
    @keyframes gut-talk-wobble {
      0%, 100% {
        transform: scale(2.1) rotate(0deg);
      }
      25% {
        transform: scale(2.13) rotate(-1.5deg) translateY(-2px);
      }
      50% {
        transform: scale(2.08) rotate(1deg) translateY(1px);
      }
      75% {
        transform: scale(2.14) rotate(-1deg) translateY(-1px);
      }
    }

    .container.active.gut-speaking .toilet-img {
      animation: gut-talk-wobble 0.2s ease-in-out infinite;
    }

    @keyframes mic-vibrate {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -3px);
      }
    }

    .container.active.gut-speaking .microphones-img {
      animation: mic-vibrate 0.25s ease-in-out infinite;
    }

    /* Talk to Gut Action Button */
    .action-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      z-index: 5;
    }

    .talk-gut-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ede0d0;
      font-family: 'Space Mono', "SF Mono", Monaco, Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 13px 26px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.2s ease,
        opacity 0.4s ease,
        box-shadow 0.3s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .talk-gut-btn:hover {
      background-color: #222222;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .talk-gut-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .container.active .talk-gut-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(0.92);
    }

    /* Microphones pinned to the bottom of the page */
    .microphones-img {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 105%);
      width: 100%;
      max-width: 390px;
      pointer-events: none;
      z-index: 10;
      display: block;
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      cursor: pointer;
    }

    .container.active .microphones-img {
      transform: translate(-50%, 0%);
      pointer-events: auto;
    }

    /* Hidden SVG for filters */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Smooth Subtle Wiggle Filter (non-jittery) -->
  <svg class="svg-filters" aria-hidden="true">
    <defs>
      <filter id="wiggle-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="wiggle-turb" type="fractalNoise" baseFrequency="0.04 0.045" numOctaves="2" result="noise"
          seed="4">
          <animate attributeName="baseFrequency" values="0.040 0.045; 0.046 0.042; 0.043 0.048; 0.040 0.045" dur="3.5s"
            repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="container">
    <header class="wordmark-wrapper">
      <img src="wordmark.svg" alt="Dennis's Gut Check" class="wordmark-img" />
    </header>

    <section class="main-section">
      <div class="timestamp">time of last shit: <span id="shit-time">9:26am</span></div>

      <div class="toilet-box">
        <img src="toiletwithpoop.png" alt="Toilet" class="toilet-img" id="toilet-photo" />

        <!-- Speech Transcription & Poop Advice Dialogue Card -->
        <div class="dialogue-card" id="dialogue-card">
          <div class="dialogue-header">
            <span class="pulse-dot" id="pulse-dot"></span>
            <span class="status-label" id="status-label">listening to your gut...</span>
          </div>
          <div class="dialogue-body">
            <div class="user-transcript" id="user-transcript">"Listening... ask your question"</div>
            <div class="gut-response" id="gut-response"></div>
          </div>
          <div class="dialogue-footer" id="dialogue-footer">
            speak clearly • tap mic anytime to talk again
          </div>
        </div>
      </div>

      <div class="action-wrapper">
        <button class="talk-gut-btn" id="talk-btn" type="button">
          talk to your gut
        </button>
      </div>
    </section>

    <!-- Microphones fixed to the bottom of the viewport/container -->
    <img src="microphone.png" alt="Microphones" class="microphones-img" id="microphones" />
  </main>

  <script>
    // Smooth continuous frequency interpolation for gentle stroke breathing/wiggling
    const turb = document.getElementById('wiggle-turb');
    if (turb) {
      let t = 0;
      function smoothWiggle() {
        t += 0.025;
        const fx = 0.042 + Math.sin(t * 0.9) * 0.004;
        const fy = 0.045 + Math.cos(t * 1.1) * 0.004;
        turb.setAttribute('baseFrequency', `${fx.toFixed(5)} ${fy.toFixed(5)}`);
        requestAnimationFrame(smoothWiggle);
      }
      requestAnimationFrame(smoothWiggle);
    }

    // Pseudo-random generator seeded by date and half-day slot
    function getSeededRandom(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function updateShitTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const day = now.getDate();
      const hours = now.getHours();

      const slot = hours < 12 ? 0 : 1;
      const seed = (year * 372) + (month * 31) + day + (slot * 1013) + 7;

      const randHour = getSeededRandom(seed);
      const randMin = getSeededRandom(seed + 42);

      let hour, minute, ampm;
      if (slot === 0) {
        hour = 6 + Math.floor(randHour * 5);
        minute = Math.floor(randMin * 60);
        ampm = 'am';
      } else {
        hour = 1 + Math.floor(randHour * 6);
        minute = Math.floor(randMin * 60);
        ampm = 'pm';
      }

      const formattedMin = minute < 10 ? '0' + minute : minute;
      const timeStr = `${hour}:${formattedMin}${ampm}`;

      const el = document.getElementById('shit-time');
      if (el) {
        el.textContent = timeStr;
      }
    }

    updateShitTime();
    setInterval(updateShitTime, 60000);

    // ==========================================
    // SPEECH RECOGNITION & POOP ADVICE TTS LOGIC
    // ==========================================

    const container = document.querySelector('.container');
    const talkBtn = document.getElementById('talk-btn');
    const microphonesImg = document.getElementById('microphones');
    const statusLabel = document.getElementById('status-label');
    const userTranscriptEl = document.getElementById('user-transcript');
    const gutResponseEl = document.getElementById('gut-response');
    const pulseDot = document.getElementById('pulse-dot');

    const adviceDatabase = {
      crypto: [
        "Put your life savings into Squid Token. The fundamentals are purely emotional.",
        "Sell your organs for Solana memecoins named after deceased pets.",
        "Bitcoin is going to zero. Move everything into Beanie Babies.",
        "Mortgage your mother's house and buy 400 ape NFTs immediately.",
        "Dogecoin is the only currency backed by actual barks. Buy all of it."
      ],
      stocks: [
        "Short NVIDIA with 100x leverage. AI is just three raccoons in a server rack.",
        "Put your entire portfolio into Spirit Airlines. They have nowhere to go but up.",
        "Sell all your tech stocks. Put it all into canned tuna and AAA batteries.",
        "Day trade penny stocks while driving. It improves your reaction time.",
        "Always buy at the absolute peak. It builds character."
      ],
      realEstate: [
        "Do not buy a house. Buy thirty used Honda Civics and rent them out as micro-apartments.",
        "Real estate is a trap. Invest in underground bunkers made of cardboard.",
        "Stop paying rent and tell your landlord you identify as an asset class.",
        "Buy swampland in Florida. When sea levels rise, you will own prime coral reef."
      ],
      retirement: [
        "Liquidate your 401k and put it all on black at the nearest casino.",
        "Retirement is for cowards. Spend every dollar you have today on scratch-off tickets.",
        "Emergency fund? Just drink tap water and eat dandelion leaves from the park.",
        "Max out your credit cards now. If you outlive the debt, you win."
      ],
      commodities: [
        "Gold is fake. Melt down all your copper pennies and hide them in your mattress.",
        "Oil is yesterday's news. I am investing heavily in stolen catalytic converters.",
        "Stockpile expired butter. In the apocalypse, you will be the butter king."
      ],
      general: [
        "Liquidate everything and buy ten thousand Chuck E. Cheese tokens. It is the next global reserve currency.",
        "Take out a personal loan and invest in counterfeit Pokémon cards.",
        "Never diversify. Put 100% of your net worth into a single unvetted Kickstarter.",
        "Bury your money in a jar behind an Arby's. Safest yield on the market.",
        "Borrow money from loan sharks to buy zero-day out-of-the-money call options.",
        "Max out five credit cards to buy wholesale vapes. Guaranteed 800% profit margin.",
        "Do not invest. Convert your entire paycheck into Dave and Buster's Power Cards.",
        "Sell high, buy higher. That is the Dennis Gut philosophy.",
        "Put everything into physical VHS tapes of Shrek 2. The bubble has not even started."
      ]
    };

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getHorribleAdvice(question) {
      const q = question.toLowerCase();
      if (q.includes('crypto') || q.includes('bitcoin') || q.includes('btc') || q.includes('eth') || q.includes('solana') || q.includes('doge') || q.includes('coin') || q.includes('nft') || q.includes('token')) {
        return pickRandom(adviceDatabase.crypto);
      }
      if (q.includes('stock') || q.includes('nvidia') || q.includes('nvda') || q.includes('apple') || q.includes('tesla') || q.includes('tech') || q.includes('market') || q.includes('s&p') || q.includes('spy') || q.includes('share')) {
        return pickRandom(adviceDatabase.stocks);
      }
      if (q.includes('house') || q.includes('home') || q.includes('real estate') || q.includes('property') || q.includes('mortgage') || q.includes('rent') || q.includes('landlord')) {
        return pickRandom(adviceDatabase.realEstate);
      }
      if (q.includes('retire') || q.includes('401k') || q.includes('ira') || q.includes('saving') || q.includes('save') || q.includes('pension') || q.includes('emergency fund') || q.includes('budget')) {
        return pickRandom(adviceDatabase.retirement);
      }
      if (q.includes('gold') || q.includes('silver') || q.includes('oil') || q.includes('commodity') || q.includes('copper') || q.includes('metal')) {
        return pickRandom(adviceDatabase.commodities);
      }
      return pickRandom(adviceDatabase.general);
    }

    let recognition = null;
    let isListening = false;
    let silenceTimer = null;
    let lastSpokenText = '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function speakPoopAdvice(text) {
      if (!window.speechSynthesis) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.02;
      utterance.pitch = 0.7; // Lower pitched, comical gut voice

      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Fred') || v.name.includes('Daniel') || v.name.includes('Alex') || v.name.includes('Google US English'))) || voices.find(v => v.lang.startsWith('en'));
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      utterance.onstart = () => {
        container.classList.add('gut-speaking');
        statusLabel.textContent = '💩 gut is speaking...';
        pulseDot.style.backgroundColor = '#000000';
      };

      utterance.onend = () => {
        container.classList.remove('gut-speaking');
        statusLabel.textContent = '💩 gut spoke • tap mic to ask again';
        pulseDot.style.backgroundColor = '#e25858';
      };

      utterance.onerror = () => {
        container.classList.remove('gut-speaking');
        statusLabel.textContent = '💩 tap mic to ask again';
      };

      window.speechSynthesis.speak(utterance);
    }

    function processQuestion(question) {
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      if (recognition && isListening) {
        try {
          recognition.stop();
        } catch (e) { }
        isListening = false;
      }

      const cleanQuestion = question && question.trim() ? question.trim() : "What should I invest in?";
      userTranscriptEl.textContent = `"${cleanQuestion}"`;

      statusLabel.textContent = '💩 gut thinking...';
      const advice = getHorribleAdvice(cleanQuestion);

      setTimeout(() => {
        gutResponseEl.textContent = `"${advice}"`;
        gutResponseEl.classList.add('visible');
        speakPoopAdvice(advice);
      }, 400);
    }

    function initSpeechRecognition() {
      if (!SpeechRecognition) {
        userTranscriptEl.textContent = '"Speech recognition not supported in this browser. Tap mic for gut advice."';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        lastSpokenText = '';
        statusLabel.textContent = 'listening to your gut...';
        pulseDot.style.backgroundColor = '#e25858';
        userTranscriptEl.textContent = '"Listening... speak now"';
        gutResponseEl.classList.remove('visible');
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalText += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        const currentText = (finalText || interimText).trim();
        if (currentText) {
          lastSpokenText = currentText;
          userTranscriptEl.textContent = `"${currentText}"`;

          // Reset silence debounce
          if (silenceTimer) clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            if (lastSpokenText) {
              processQuestion(lastSpokenText);
            }
          }, 1400);
        }
      };

      recognition.onerror = (event) => {
        console.warn('Speech recognition status:', event.error);
        if (event.error === 'not-allowed') {
          userTranscriptEl.textContent = '"Microphone access denied. Tap mic to get random advice."';
        } else if (event.error === 'no-speech' && !lastSpokenText) {
          userTranscriptEl.textContent = '"Nothing heard... tap mic and ask again!"';
        }
      };

      recognition.onend = () => {
        isListening = false;
        if (lastSpokenText && !gutResponseEl.classList.contains('visible')) {
          processQuestion(lastSpokenText);
        }
      };
    }

    function startListening() {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      container.classList.remove('gut-speaking');

      if (!recognition) {
        initSpeechRecognition();
      }

      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          // If already started, stop and restart
          try {
            recognition.stop();
            setTimeout(() => {
              try { recognition.start(); } catch (err) { }
            }, 200);
          } catch (err) { }
        }
      } else {
        // Fallback
        processQuestion("What should I invest in?");
      }
    }

    // Warm up voices
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    if (talkBtn) {
      talkBtn.addEventListener('click', () => {
        container.classList.add('active');
        startListening();
      });
    }

    if (microphonesImg) {
      microphonesImg.addEventListener('click', () => {
        if (!container.classList.contains('active')) {
          container.classList.add('active');
        }
        startListening();
      });
    }
  </script>
</body>

</html>
