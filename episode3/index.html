<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
  <title>Dennis's Gut Check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ede0d0;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 24px 0;
      position: relative;
      overflow: hidden;
    }

    /* Wordmark Header with smooth subtle wiggle */
    .wordmark-wrapper {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wordmark-img {
      width: 220px;
      max-width: 65vw;
      height: auto;
      display: block;
      user-select: none;
      filter: url(#wiggle-filter);
      will-change: filter;
    }

    /* Main Section */
    .main-section {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    /* Subtle infrequent blinking timestamp: italics, monospace, light red */
    .timestamp {
      font-family: 'Space Mono', "SF Mono", Monaco, Menlo, "Roboto Mono", Consolas, monospace;
      font-style: italic;
      font-size: 14px;
      font-weight: 400;
      color: #e25858;
      margin-bottom: 6px;
      text-align: left;
      animation: subtle-blink 9s ease-in-out infinite;
      letter-spacing: -0.01em;
    }

    @keyframes subtle-blink {

      0%,
      84%,
      100% {
        opacity: 1;
      }

      88% {
        opacity: 0.25;
      }

      91% {
        opacity: 0.95;
      }

      94% {
        opacity: 0.35;
      }

      97% {
        opacity: 1;
      }
    }

    /* Toilet Image Box */
    .toilet-box {
      width: 100%;
      height: 380px;
      background-color: #d9d9d9;
      position: relative;
      overflow: hidden;
    }

    .toilet-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1);
      transform-origin: 50% 85%;
      transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .container.active .toilet-img {
      transform: scale(2.1);
    }

    /* Speaking wobbles for toilet photo and mic */
    @keyframes gut-talk-wobble {
      0% {
        transform: scale(2.1) rotate(0deg);
      }
      20% {
        transform: scale(2.14) rotate(-2.5deg) translateY(-2px);
      }
      40% {
        transform: scale(2.07) rotate(2deg) translateY(2px);
      }
      60% {
        transform: scale(2.15) rotate(-1.5deg) translateY(-1px);
      }
      80% {
        transform: scale(2.08) rotate(2.5deg) translateY(1px);
      }
      100% {
        transform: scale(2.1) rotate(0deg);
      }
    }

    .container.active.gut-speaking .toilet-img {
      animation: gut-talk-wobble 0.22s ease-in-out infinite !important;
    }

    @keyframes mic-vibrate {
      0%, 100% {
        transform: translate(-50%, 0);
      }
      50% {
        transform: translate(-50%, -4px);
      }
    }

    .container.active.gut-speaking .microphones-img {
      animation: mic-vibrate 0.25s ease-in-out infinite !important;
    }

    /* Talk to Gut Action Button */
    .action-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 20px;
      z-index: 5;
    }

    .talk-gut-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      color: #ede0d0;
      font-family: 'Space Mono', "SF Mono", Monaco, Menlo, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 13px 26px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.2s ease,
        opacity 0.4s ease,
        box-shadow 0.3s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .talk-gut-btn:hover {
      background-color: #222222;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }

    .talk-gut-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .container.active .talk-gut-btn {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px) scale(0.92);
    }

    /* Microphones pinned to the bottom of the page */
    .microphones-img {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 105%);
      width: 100%;
      max-width: 390px;
      pointer-events: none;
      z-index: 10;
      display: block;
      transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      cursor: pointer;
    }

    .container.active .microphones-img {
      transform: translate(-50%, 0%);
      pointer-events: auto;
    }

    /* Hidden SVG for filters */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Smooth Subtle Wiggle Filter (non-jittery) -->
  <svg class="svg-filters" aria-hidden="true">
    <defs>
      <filter id="wiggle-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="wiggle-turb" type="fractalNoise" baseFrequency="0.04 0.045" numOctaves="2" result="noise"
          seed="4">
          <animate attributeName="baseFrequency" values="0.040 0.045; 0.046 0.042; 0.043 0.048; 0.040 0.045" dur="3.5s"
            repeatCount="indefinite" />
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="container">
    <header class="wordmark-wrapper">
      <img src="wordmark.svg" alt="Dennis's Gut Check" class="wordmark-img" />
    </header>

    <section class="main-section">
      <div class="timestamp">time of last shit: <span id="shit-time">9:26am</span></div>

      <div class="toilet-box">
        <img src="toiletwithpoop.png" alt="Toilet" class="toilet-img" id="toilet-photo" />
      </div>

      <div class="action-wrapper">
        <button class="talk-gut-btn" id="talk-btn" type="button">
          talk to your gut
        </button>
      </div>
    </section>

    <!-- Microphones fixed to the bottom of the viewport/container -->
    <img src="microphone.png" alt="Microphones" class="microphones-img" id="microphones" />
  </main>

  <script>
    // Smooth continuous frequency interpolation for gentle stroke breathing/wiggling
    const turb = document.getElementById('wiggle-turb');
    if (turb) {
      let t = 0;
      function smoothWiggle() {
        t += 0.025;
        const fx = 0.042 + Math.sin(t * 0.9) * 0.004;
        const fy = 0.045 + Math.cos(t * 1.1) * 0.004;
        turb.setAttribute('baseFrequency', `${fx.toFixed(5)} ${fy.toFixed(5)}`);
        requestAnimationFrame(smoothWiggle);
      }
      requestAnimationFrame(smoothWiggle);
    }

    // Pseudo-random generator seeded by date and half-day slot
    function getSeededRandom(seed) {
      const x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    function updateShitTime() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const day = now.getDate();
      const hours = now.getHours();

      const slot = hours < 12 ? 0 : 1;
      const seed = (year * 372) + (month * 31) + day + (slot * 1013) + 7;

      const randHour = getSeededRandom(seed);
      const randMin = getSeededRandom(seed + 42);

      let hour, minute, ampm;
      if (slot === 0) {
        hour = 6 + Math.floor(randHour * 5);
        minute = Math.floor(randMin * 60);
        ampm = 'am';
      } else {
        hour = 1 + Math.floor(randHour * 6);
        minute = Math.floor(randMin * 60);
        ampm = 'pm';
      }

      const formattedMin = minute < 10 ? '0' + minute : minute;
      const timeStr = `${hour}:${formattedMin}${ampm}`;

      const el = document.getElementById('shit-time');
      if (el) {
        el.textContent = timeStr;
      }
    }

    updateShitTime();
    setInterval(updateShitTime, 60000);

    // ==========================================================
    // SIMPLE, HILARIOUS & OBVIOUSLY TERRIBLE ADVICE DATABASE
    // ==========================================================

    const horribleAdviceDatabase = {
      money: [
        "If you run out of money, just print more on your home printer.",
        "Borrow ten million dollars from your grandma and tell her it is a high-yield savings account.",
        "Put your company's entire bank account into scratch-off lottery tickets.",
        "Charge one million dollars per item and only find one customer.",
        "Ask for a billion dollars in cash stuffed into a grocery bag.",
        "Tell everyone you do not believe in money and demand thirty cows instead.",
        "Leave your wallet in a public park and hope it attracts new business."
      ],
      people: [
        "Fire your whole team and do all the work yourself in Microsoft Paint.",
        "Pay your employees in half-eaten pizza crusts and motivational handshakes.",
        "Only hire people who have the exact same first name as you.",
        "If an employee asks for a raise, challenge them to an arm wrestling match.",
        "Scream at your business partner in a restaurant to show everyone who is the boss.",
        "Replace your manager with a plastic skeleton wearing sunglasses.",
        "Make all important decisions by playing rock paper scissors in the mirror."
      ],
      product: [
        "Make all your products out of expired cheese to cut costs.",
        "Scream at your computer until the bugs fix themselves.",
        "Replace your whole app with a twenty-minute video of a dancing hamster.",
        "Never test your product. If it catches on fire, that builds character.",
        "Add forty pop-up ads that play loud car horn sounds every three seconds.",
        "Build a product that does absolutely nothing, but make it very loud and colorful."
      ],
      customers: [
        "If a customer complains, block their phone number and change your identity.",
        "Spend your entire marketing budget on a giant billboard of your own face.",
        "Tell angry customers that your company is a hallucination and hang up immediately.",
        "Call customers at three in the morning to ask if they are thinking about your product.",
        "Require customers to send you a handwritten apology letter before they can buy anything.",
        "Promise customers your product gives them laser vision. Deal with the lawsuits later."
      ],
      runway: [
        "When you run out of money, just tell everyone you are doing a secret billionaire experiment.",
        "Slash expenses by moving the entire company into a single rented inflatable bouncy castle.",
        "Pivot your entire business into selling counterfeit chocolate bars at high school soccer games.",
        "Pretend you were bought out by the government and refuse to answer questions."
      ],
      general: [
        "Fake your own death and re-brand as an Italian luxury fashion house.",
        "Stop sleeping forever. Sleep is for people who do not want to be rich.",
        "Wear a fake mustache to every meeting and pretend to be your own evil twin brother.",
        "Whenever someone asks you a hard question, hiss at them and crawl under the desk.",
        "Quit what you are doing and start a competitive underground worm racing league.",
        "Drink nineteen energy drinks, yell at a bird in the parking lot, and make no changes.",
        "Ship complete garbage today. Move to an uninhabited island tomorrow."
      ]
    };

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getHorribleAdvice(question) {
      const q = (question || '').toLowerCase();

      // Money / Cash / Funding / Investors / Pricing / Cost
      if (q.includes('money') || q.includes('cash') || q.includes('price') || q.includes('cost') || q.includes('pay') || q.includes('invest') || q.includes('raise') || q.includes('fund') || q.includes('bank') || q.includes('rich') || q.includes('broke') || q.includes('expensive') || q.includes('cheap') || q.includes('salary')) {
        return pickRandom(horribleAdviceDatabase.money);
      }

      // People / Team / Hire / Fire / Boss / Cofounder / Partner / Employee
      if (q.includes('hire') || q.includes('fire') || q.includes('team') || q.includes('people') || q.includes('boss') || q.includes('partner') || q.includes('cofounder') || q.includes('coworker') || q.includes('employee') || q.includes('manager') || q.includes('friend') || q.includes('intern')) {
        return pickRandom(horribleAdviceDatabase.people);
      }

      // Product / Code / App / Website / Build / Bug / Feature / Idea
      if (q.includes('product') || q.includes('app') || q.includes('site') || q.includes('website') || q.includes('code') || q.includes('build') || q.includes('bug') || q.includes('fix') || q.includes('feature') || q.includes('tech') || q.includes('idea') || q.includes('make')) {
        return pickRandom(horribleAdviceDatabase.product);
      }

      // Customers / Marketing / Sales / Users / Complain / Ads / Growth
      if (q.includes('customer') || q.includes('user') || q.includes('client') || q.includes('complain') || q.includes('market') || q.includes('sale') || q.includes('ad') || q.includes('growth') || q.includes('review') || q.includes('feedback')) {
        return pickRandom(horribleAdviceDatabase.customers);
      }

      // Failing / Pivot / Out of money / Broke / Quit / Save
      if (q.includes('fail') || q.includes('pivot') || q.includes('lose') || q.includes('dead') || q.includes('broke') || q.includes('quit') || q.includes('save') || q.includes('survive')) {
        return pickRandom(horribleAdviceDatabase.runway);
      }

      return pickRandom(horribleAdviceDatabase.general);
    }

    // ==========================================================
    // ROBUST SPEECH SYNTHESIS & RECOGNITION CONTROLLER
    // ==========================================================

    const container = document.querySelector('.container');
    const talkBtn = document.getElementById('talk-btn');
    const microphonesImg = document.getElementById('microphones');

    // Keep global reference to avoid Chromium GC bug
    window._currentUtterance = null;
    let activeRecognition = null;
    let fallbackWobbleTimer = null;

    // Periodic unpause keep-alive for Chrome TTS engine
    setInterval(() => {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    }, 4000);

    function triggerWobble(durationMs) {
      if (fallbackWobbleTimer) clearTimeout(fallbackWobbleTimer);
      container.classList.add('gut-speaking');
      fallbackWobbleTimer = setTimeout(() => {
        container.classList.remove('gut-speaking');
      }, durationMs);
    }

    function playPoopVoice(text) {
      if (!('speechSynthesis' in window)) {
        triggerWobble(3000);
        return;
      }

      // Reset and resume speech engine
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      // Estimated speech duration for visual sync fallback
      const approxDurationMs = Math.max(2500, (text.split(' ').length / 2.5) * 1000 + 1000);
      triggerWobble(approxDurationMs);

      setTimeout(() => {
        try {
          window.speechSynthesis.resume();
        } catch (e) { }

        const utterance = new SpeechSynthesisUtterance(text);
        window._currentUtterance = utterance;

        utterance.lang = 'en-US';
        utterance.rate = 1.02;
        utterance.pitch = 0.7; // Deep/gritty poop pitch

        const voices = window.speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
          const v = voices.find(voice => voice.lang.startsWith('en') && (voice.name.includes('Fred') || voice.name.includes('Daniel') || voice.name.includes('Alex') || voice.name.includes('Google US English') || voice.name.includes('Samantha'))) || voices.find(voice => voice.lang.startsWith('en'));
          if (v) utterance.voice = v;
        }

        utterance.onstart = () => {
          container.classList.add('gut-speaking');
        };

        const stopSpeaking = () => {
          container.classList.remove('gut-speaking');
          if (fallbackWobbleTimer) clearTimeout(fallbackWobbleTimer);
          window._currentUtterance = null;
        };

        utterance.onend = stopSpeaking;
        utterance.onerror = (err) => {
          console.warn('TTS error:', err);
          stopSpeaking();
        };

        window.speechSynthesis.speak(utterance);
      }, 40);
    }

    function startListening() {
      // Unblock and prime audio
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();
        } catch (e) { }
      }
      container.classList.remove('gut-speaking');

      // Abort any lingering recognition session
      if (activeRecognition) {
        try { activeRecognition.abort(); } catch (e) { }
        activeRecognition = null;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        // Fallback for browsers with no speech recognition
        setTimeout(() => {
          const advice = getHorribleAdvice("money");
          playPoopVoice(advice);
        }, 600);
        return;
      }

      // Always instantiate a fresh SpeechRecognition to prevent Chrome "already started" or frozen state
      const rec = new SpeechRecognition();
      activeRecognition = rec;
      rec.continuous = false;
      rec.interimResults = true;
      rec.lang = 'en-US';

      let capturedText = '';
      let hasDeliveredAnswer = false;

      function finalizeAnswer() {
        if (hasDeliveredAnswer) return;
        hasDeliveredAnswer = true;

        if (activeRecognition) {
          try { activeRecognition.abort(); } catch (e) { }
          activeRecognition = null;
        }

        const question = capturedText.trim() || "What should I do?";
        const advice = getHorribleAdvice(question);
        
        // Wait 120ms for microphone hardware stream release before playing TTS
        setTimeout(() => {
          playPoopVoice(advice);
        }, 120);
      }

      rec.onresult = (event) => {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          capturedText = event.results[i][0].transcript;
        }
      };

      rec.onend = () => {
        finalizeAnswer();
      };

      rec.onerror = (event) => {
        console.warn('SpeechRecognition status:', event.error);
        if (event.error !== 'no-speech') {
          finalizeAnswer();
        }
      };

      try {
        rec.start();
      } catch (err) {
        console.warn('Recognition start failed:', err);
        finalizeAnswer();
      }
    }

    // Warm up voice list
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    if (talkBtn) {
      talkBtn.addEventListener('click', () => {
        container.classList.add('active');
        startListening();
      });
    }

    if (microphonesImg) {
      microphonesImg.addEventListener('click', () => {
        if (!container.classList.contains('active')) {
          container.classList.add('active');
        }
        startListening();
      });
    }
  </script>
</body>

</html>
