<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Episode 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #004cff;
      overflow-x: hidden;
    }

    #scroll-track {
      height: 400vh;
      position: relative;
    }

    #canvas-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #overlay-text {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: center;
      transition: opacity 120ms linear;
    }

    #top-line {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      font-size: 25px;
      font-weight: 400;
      line-height: 1.05;
    }

    #bottom-line {
      position: absolute;
      left: 50%;
      bottom: 32%;
      transform: translateX(-50%);
      font-size: 21px;
      font-weight: 400;
      line-height: 1.1;
    }

    #scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 21%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 400;
      opacity: 0.4;
      animation: cue-blink 1.1s ease-in-out infinite;
    }

    #scroll-cue .arrow {
      display: block;
      margin-top: 2px;
      font-size: 1.2em;
      line-height: 1;
    }

    @keyframes cue-blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    #face-gui {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 12;
      width: 280px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(8, 18, 78, 0.84);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    #face-gui h2 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .face-row { margin-bottom: 8px; }
    .face-row label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      opacity: 0.92;
      font-size: 11px;
    }
    .face-row input[type="range"] { width: 100%; }

    .face-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .face-actions button {
      flex: 1;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      padding: 7px 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .face-actions button:hover { background: rgba(255, 255, 255, 0.2); }

    #face-gui-status {
      margin-top: 8px;
      min-height: 14px;
      font-size: 10px;
      opacity: 0.85;
    }

  </style>
</head>
<body>

<div id="scroll-track"></div>
<div id="canvas-wrapper"><canvas id="c"></canvas></div>
<div id="overlay-text">
  <div id="top-line">HELLO SUSANNAH</div>
  <div id="bottom-line">I AM YOUR SOLUTION</div>
  <div id="scroll-cue">SCROLL <span class="arrow">↓</span></div>
</div>
<div id="face-gui">
  <h2>Face Overlay GUI</h2>
  <div id="face-controls"></div>
  <div class="face-actions">
    <button id="face-copy-btn" type="button">Copy Face JSON</button>
    <button id="face-paste-btn" type="button">Paste Face JSON</button>
  </div>
  <div id="face-gui-status"></div>
</div>


<script async src="https://unpkg.com/es-module-shims@1.8.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

// ─── Renderer + Scene ──────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const textureLoader = new THREE.TextureLoader();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 6, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x99aaff, 0.6);
rim.position.set(-4, 2, -5);
scene.add(rim);

// ─── Live Params ───────────────────────────────────────────────
const params = {
  bgColor:     '#004cff',
  scrollStart: 0,
  scrollEnd:   2134,
  startZ:      24,
  endZ:        3.5,
  faceY:       1.2,
  modelY:      -1.85,
};

function applyBg(hex) {
  const col = new THREE.Color(hex);
  renderer.setClearColor(col, 1);
  scene.background = col;
  document.body.style.background = hex;
}
applyBg(params.bgColor);

// ─── Model ─────────────────────────────────────────────────────
let model = null;
let faceTexture = null;
let facePlane = null;
const faceParams = {
  x: 0.1,
  y: 4.71,
  z: 1.05,
  width: 3.68,
  height: 5.12,
  rotY: 0,
};

textureLoader.load('dollface.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  faceTexture = tex;
});

const mtlLoader = new MTLLoader();
mtlLoader.setPath('doll_object/');
mtlLoader.load(
  'AnimeChibiModelBase.mtl',
  (mats) => {
    mats.preload();
    const obj = new OBJLoader();
    obj.setMaterials(mats);
    obj.load('doll_object/AnimeChibiModelBase.obj', setupModel, null, loadFallback);
  },
  null,
  loadFallback
);

function loadFallback() {
  new OBJLoader().load('doll_object/AnimeChibiModelBase.obj', (obj) => {
    applyRigMaterial(obj);
    setupModel(obj);
  });
}

function applyRigMaterial(root) {
  root.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshPhongMaterial({
        color: 0xf2c7b3,
        specular: 0x111111,
        shininess: 8,
      });
    }
  });
}

function setupModel(obj) {
  applyRigMaterial(obj);

  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const scale  = 4 / Math.max(size.x, size.y, size.z);

  // Recentre geometry pivot at model base-centre
  obj.position.copy(center.clone().negate().multiplyScalar(scale));
  obj.scale.setScalar(scale);

  // Start facing AWAY from camera (back of head toward viewer)
  obj.rotation.y = Math.PI;

  addFaceOverlay(obj);
  model = obj;
  scene.add(model);
}

function addFaceOverlay(root) {
  if (!faceTexture) {
    textureLoader.load('dollface.png', (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      faceTexture = tex;
      addFaceOverlay(root);
    });
    return;
  }

  const faceMaterial = new THREE.MeshBasicMaterial({
    map: faceTexture,
    transparent: true,
    alphaTest: 0.02,
    side: THREE.FrontSide,
    depthWrite: false,
  });

  // Flat face card placed at the front of the head.
  facePlane = new THREE.Mesh(new THREE.PlaneGeometry(faceParams.width, faceParams.height), faceMaterial);
  applyFaceTransform();
  root.add(facePlane);
}

function applyFaceTransform() {
  if (!facePlane) return;
  facePlane.position.set(faceParams.x, faceParams.y, faceParams.z);
  facePlane.rotation.y = THREE.MathUtils.degToRad(faceParams.rotY);
  facePlane.geometry.dispose();
  facePlane.geometry = new THREE.PlaneGeometry(faceParams.width, faceParams.height);
}

// ─── Scroll ────────────────────────────────────────────────────
let scrollY = 0;
window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });
const overlayText = document.getElementById('overlay-text');
const fadeDistance = 500;
const faceControls = document.getElementById('face-controls');
const faceStatus = document.getElementById('face-gui-status');
const faceSliderBindings = [];

function setFaceStatus(msg) {
  faceStatus.textContent = msg;
  window.setTimeout(() => {
    if (faceStatus.textContent === msg) faceStatus.textContent = '';
  }, 1800);
}

function addFaceSlider(key, label, min, max, step = 0.01) {
  const row = document.createElement('div');
  row.className = 'face-row';
  const labelEl = document.createElement('label');
  const left = document.createElement('span');
  left.textContent = label;
  const right = document.createElement('span');
  right.textContent = String(faceParams[key]);
  labelEl.append(left, right);

  const input = document.createElement('input');
  input.type = 'range';
  input.min = String(min);
  input.max = String(max);
  input.step = String(step);
  input.value = String(faceParams[key]);
  input.addEventListener('input', () => {
    faceParams[key] = Number(input.value);
    right.textContent = String(faceParams[key]);
    applyFaceTransform();
  });

  row.append(labelEl, input);
  faceControls.appendChild(row);
  faceSliderBindings.push({ key, input, valueEl: right });
}

addFaceSlider('x', 'X', -10, 10, 0.01);
addFaceSlider('y', 'Y', -20, 20, 0.01);
addFaceSlider('z', 'Z', -10, 10, 0.01);
addFaceSlider('width', 'Width', 0.1, 20, 0.01);
addFaceSlider('height', 'Height', 0.1, 20, 0.01);
addFaceSlider('rotY', 'Y Rotation (deg)', -180, 180, 1);

document.getElementById('face-copy-btn').addEventListener('click', async () => {
  const json = JSON.stringify(faceParams, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    setFaceStatus('Copied face settings');
  } catch {
    window.prompt('Copy face settings:', json);
  }
});

document.getElementById('face-paste-btn').addEventListener('click', async () => {
  let raw = '';
  try {
    raw = await navigator.clipboard.readText();
  } catch {
    raw = window.prompt('Paste face JSON:') || '';
  }
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    Object.keys(faceParams).forEach((k) => {
      if (typeof parsed[k] === 'number' && Number.isFinite(parsed[k])) {
        faceParams[k] = parsed[k];
      }
    });
    faceSliderBindings.forEach(({ key, input, valueEl }) => {
      input.value = String(faceParams[key]);
      valueEl.textContent = String(faceParams[key]);
    });
    applyFaceTransform();
    setFaceStatus('Pasted face settings');
  } catch {
    setFaceStatus('Invalid JSON');
  }
});

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function easeOut(t) {
  // Cubic ease-out: starts immediately fast, decelerates to a smooth stop
  return 1 - Math.pow(1 - t, 3);
}

function lerp(a, b, t) { return a + (b - a) * t; }


// ─── Render Loop ───────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  resizeIfNeeded();

  const raw = clamp01((scrollY - params.scrollStart) /
                      Math.max(1, params.scrollEnd - params.scrollStart));
  const t = easeOut(raw);
  const introOpacity = clamp01(1 - (scrollY / fadeDistance));

  if (model) {
    // Rotate from π (back) → 0 (front), purely scroll-driven
    model.rotation.y = Math.PI * (1 - t);
    // Vertical offset so user can nudge doll up/down
    model.position.y = params.modelY;
  }

  // Camera: pull in from startZ → endZ, and rise up toward face
  camera.position.z = lerp(params.startZ, params.endZ, t);
  camera.position.y = lerp(0, params.faceY * 0.35, t); // camera lifts slightly

  // Look toward the face: y=0 at start, y=faceY at end
  const lookY = lerp(0, params.faceY, t);
  camera.lookAt(0, lookY, 0);
  overlayText.style.opacity = String(introOpacity);

  renderer.render(scene, camera);

}

function resizeIfNeeded() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (renderer.domElement.width !== w || renderer.domElement.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

animate();

</script>
</body>
</html>
