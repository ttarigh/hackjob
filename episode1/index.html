<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Episode 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #004cff;
      overflow-x: hidden;
    }

    #scroll-track {
      height: 400vh;
      position: relative;
    }

    #canvas-wrapper {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    #overlay-text {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-align: center;
      transition: opacity 120ms linear;
    }

    #top-line {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translateX(-50%);
      font-size: 25px;
      font-weight: 400;
      line-height: 1.05;
    }

    #bottom-line {
      position: absolute;
      left: 50%;
      bottom: 32%;
      transform: translateX(-50%);
      font-size: 21px;
      font-weight: 400;
      line-height: 1.1;
    }

    #scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 21%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 400;
      opacity: 0.4;
      animation: cue-blink 1.1s ease-in-out infinite;
    }

    #scroll-cue .arrow {
      display: block;
      margin-top: 2px;
      font-size: 1.2em;
      line-height: 1;
    }

    @keyframes cue-blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.6; }
    }

    #squeeze-btn {
      position: fixed;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      z-index: 8;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: none;
    }

    #check-phone-btn {
      position: fixed;
      z-index: 9;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -100%);
      transition: none;
      white-space: nowrap;
    }

    #phone-fade {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 120ms linear;
    }

    #phone-back-btn {
      position: fixed;
      top: 32px;
      left: 28px;
      z-index: 11;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms linear;
    }

    #phone-back-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

  </style>
</head>
<body>

<div id="scroll-track"></div>
<div id="canvas-wrapper"><canvas id="c"></canvas></div>
<div id="overlay-text">
  <div id="top-line">HELLO SUSANNAH</div>
  <div id="bottom-line">I AM YOUR SOLUTION</div>
  <div id="scroll-cue">SCROLL <span class="arrow">↓</span></div>
</div>
<button id="squeeze-btn" type="button">SQUEEZE</button>
<button id="check-phone-btn" type="button">CHECK HER PHONE</button>
<div id="phone-fade"></div>
<button id="phone-back-btn" type="button">BACK</button>


<script async src="https://unpkg.com/es-module-shims@1.8.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

// ─── Renderer + Scene ──────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
const textureLoader = new THREE.TextureLoader();

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 1.4);
key.position.set(3, 6, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x99aaff, 0.6);
rim.position.set(-4, 2, -5);
scene.add(rim);

// ─── Live Params ───────────────────────────────────────────────
const params = {
  bgColor:     '#004cff',
  scrollStart: 0,
  scrollEnd:   2134,
  startZ:      24,
  endZ:        3.5,
  faceY:       1.2,
  modelY:      -1.85,
};

function applyBg(hex) {
  const col = new THREE.Color(hex);
  renderer.setClearColor(col, 1);
  scene.background = col;
  document.body.style.background = hex;
}
applyBg(params.bgColor);

// ─── Model ─────────────────────────────────────────────────────
let model = null;
let faceTexture = null;
let faceGroup = null;
let faceTopMesh = null;
let faceBottomMesh = null;
let phoneMesh = null;
let baseTopY = 0;
let baseBottomY = 0;
const faceParams = {
  x: 0.1,
  y: 4.71,
  z: 1.05,
  width: 3.68,
  height: 5.12,
  rotY: 0,
};
const talkParams = {
  cutRatio: 0.38,
  intensity: 0.09,
  speed: 23.7,
  rotateDeg: 0,
};
const phoneParams = {
  x: -1.61,
  y: 3.21,
  z: 0.85,
  rotX: 34,
  rotY: 38.4,
  rotZ: -10.3,
  scale: 1.13,
  buttonOffsetX: -18,
  buttonOffsetY: 9,
};
const phoneViewParams = {
  targetDistance: 0.12,
  riseOffset: 0.04,
  blendSpeed: 5.2,
};
const phoneButtonAnchor = new THREE.Vector3();
const phoneWorldPos = new THREE.Vector3();
const phoneNormal = new THREE.Vector3();
const phoneCameraPos = new THREE.Vector3();
const baseLookTarget = new THREE.Vector3();
const blendedLookTarget = new THREE.Vector3();
const phoneCanvasSize = { width: 1125, height: 2436 };
const phoneAspect = phoneCanvasSize.width / phoneCanvasSize.height;
const phoneBaseHeight = 1.2;
const phoneBaseWidth = phoneBaseHeight * phoneAspect;
const phoneViewState = {
  blend: 0,
  target: 0,
};

textureLoader.load('dollface.png', (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  faceTexture = tex;
});

const mtlLoader = new MTLLoader();
mtlLoader.setPath('doll_object/');
mtlLoader.load(
  'AnimeChibiModelBase.mtl',
  (mats) => {
    mats.preload();
    const obj = new OBJLoader();
    obj.setMaterials(mats);
    obj.load('doll_object/AnimeChibiModelBase.obj', setupModel, null, loadFallback);
  },
  null,
  loadFallback
);

function loadFallback() {
  new OBJLoader().load('doll_object/AnimeChibiModelBase.obj', (obj) => {
    applyRigMaterial(obj);
    setupModel(obj);
  });
}

function applyRigMaterial(root) {
  root.traverse((child) => {
    if (child.isMesh) {
      child.material = new THREE.MeshPhongMaterial({
        color: 0xf2c7b3,
        specular: 0x111111,
        shininess: 8,
      });
    }
  });
}

function setupModel(obj) {
  applyRigMaterial(obj);

  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const scale  = 4 / Math.max(size.x, size.y, size.z);

  // Recentre geometry pivot at model base-centre
  obj.position.copy(center.clone().negate().multiplyScalar(scale));
  obj.scale.setScalar(scale);

  // Start facing AWAY from camera (back of head toward viewer)
  obj.rotation.y = Math.PI;

  addFaceOverlay(obj);
  addPhoneOverlay(obj);
  model = obj;
  scene.add(model);
}

function addPhoneOverlay(root) {
  const tex = textureLoader.load('iphone.png', () => {
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
  });
  tex.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    alphaTest: 0.02,
    side: THREE.FrontSide,
    depthWrite: false,
  });
  const geo = new THREE.PlaneGeometry(phoneBaseWidth, phoneBaseHeight);
  phoneMesh = new THREE.Mesh(geo, mat);
  root.add(phoneMesh);
  applyPhoneTransform();
}

function applyPhoneTransform() {
  if (!phoneMesh) return;
  phoneMesh.position.set(phoneParams.x, phoneParams.y, phoneParams.z);
  phoneMesh.rotation.set(
    THREE.MathUtils.degToRad(phoneParams.rotX),
    THREE.MathUtils.degToRad(phoneParams.rotY),
    THREE.MathUtils.degToRad(phoneParams.rotZ)
  );
  phoneMesh.scale.setScalar(phoneParams.scale);
}

function addFaceOverlay(root) {
  if (!faceTexture) {
    textureLoader.load('dollface.png', (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      faceTexture = tex;
      addFaceOverlay(root);
    });
    return;
  }

  const topTexture = faceTexture.clone();
  topTexture.needsUpdate = true;
  topTexture.repeat.set(1, 1 - talkParams.cutRatio);
  topTexture.offset.set(0, talkParams.cutRatio);

  const bottomTexture = faceTexture.clone();
  bottomTexture.needsUpdate = true;
  bottomTexture.repeat.set(1, talkParams.cutRatio);
  bottomTexture.offset.set(0, 0);

  const topMaterial = new THREE.MeshBasicMaterial({
    map: topTexture,
    transparent: true,
    alphaTest: 0.02,
    side: THREE.FrontSide,
    depthWrite: false,
  });

  const bottomMaterial = new THREE.MeshBasicMaterial({
    map: bottomTexture,
    transparent: true,
    alphaTest: 0.02,
    side: THREE.FrontSide,
    depthWrite: false,
  });

  faceGroup = new THREE.Group();
  faceTopMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), topMaterial);
  faceBottomMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), bottomMaterial);
  faceGroup.add(faceTopMesh);
  faceGroup.add(faceBottomMesh);
  root.add(faceGroup);
  applyFaceTransform();
}

function applyFaceTransform() {
  if (!faceGroup || !faceTopMesh || !faceBottomMesh) return;

  const cut = THREE.MathUtils.clamp(talkParams.cutRatio, 0.1, 0.9);
  const bottomH = faceParams.height * cut;
  const topH = faceParams.height - bottomH;
  const bottomCenterY = -faceParams.height * 0.5 + bottomH * 0.5;
  const topCenterY = bottomCenterY + (bottomH * 0.5) + (topH * 0.5);

  faceGroup.position.set(faceParams.x, faceParams.y, faceParams.z);
  faceGroup.rotation.y = THREE.MathUtils.degToRad(faceParams.rotY);

  faceTopMesh.geometry.dispose();
  faceBottomMesh.geometry.dispose();
  faceTopMesh.geometry = new THREE.PlaneGeometry(faceParams.width, topH);
  faceBottomMesh.geometry = new THREE.PlaneGeometry(faceParams.width, bottomH);
  baseTopY = topCenterY;
  baseBottomY = bottomCenterY;
  faceTopMesh.position.set(0, baseTopY, 0);
  faceBottomMesh.position.set(0, baseBottomY, 0);

  faceTopMesh.rotation.set(0, 0, 0);
  faceBottomMesh.rotation.set(0, 0, 0);
}

function updateFaceSplitTextures() {
  if (!faceTopMesh || !faceBottomMesh) return;
  const cut = THREE.MathUtils.clamp(talkParams.cutRatio, 0.1, 0.9);
  faceTopMesh.material.map.repeat.set(1, 1 - cut);
  faceTopMesh.material.map.offset.set(0, cut);
  faceBottomMesh.material.map.repeat.set(1, cut);
  faceBottomMesh.material.map.offset.set(0, 0);
}

function setMouthOpen(openAmount) {
  if (!faceTopMesh || !faceBottomMesh) return;
  const spread = openAmount * talkParams.intensity;
  const rot = THREE.MathUtils.degToRad(openAmount * talkParams.rotateDeg);
  faceTopMesh.position.y = baseTopY + spread;
  faceBottomMesh.position.y = baseBottomY - spread;
  faceTopMesh.rotation.x = -rot;
  faceBottomMesh.rotation.x = rot;
}

// ─── Scroll ────────────────────────────────────────────────────
let scrollY = 0;
window.addEventListener('scroll', () => { scrollY = window.scrollY; }, { passive: true });
const overlayText = document.getElementById('overlay-text');
const squeezeBtn = document.getElementById('squeeze-btn');
const checkPhoneBtn = document.getElementById('check-phone-btn');
const phoneFade = document.getElementById('phone-fade');
const phoneBackBtn = document.getElementById('phone-back-btn');
const fadeDistance = 500;
const endTriggerThreshold = 0.92;
const squeezeSoundFiles = [
  'nastysayings/2.wav', 'nastysayings/3.wav', 'nastysayings/4.wav',
  'nastysayings/5.wav', 'nastysayings/6.wav', 'nastysayings/7.wav', 'nastysayings/8.wav',
  'nastysayings/9.wav', 'nastysayings/10.wav', 'nastysayings/11.wav', 'nastysayings/12.wav',
  'nastysayings/13.wav', 'nastysayings/14.wav', 'nastysayings/15.wav', 'nastysayings/16.wav',
  'nastysayings/17.wav', 'nastysayings/18.wav'
];
let reachedEnd = false;
let squeezeIndex = 0;
let currentVoiceAudio = null;
let talkPhase = 0;
let mouthOpenAmount = 0;
const endRevealState = {
  target: 0,
  value: 0,
};

function playVoice(path, onEnded) {
  if (currentVoiceAudio) {
    currentVoiceAudio.pause();
    currentVoiceAudio.currentTime = 0;
  }
  const audio = new Audio(path);
  currentVoiceAudio = audio;
  audio.preload = 'auto';
  audio.currentTime = 0;
  if (typeof onEnded === 'function') {
    audio.addEventListener('ended', () => {
      if (currentVoiceAudio === audio) onEnded();
    }, { once: true });
  }
  audio.play().catch(() => {});
  talkPhase = 0;
}

squeezeBtn.addEventListener('click', () => {
  const clip = squeezeSoundFiles[squeezeIndex];
  playVoice(clip);
  squeezeIndex = (squeezeIndex + 1) % squeezeSoundFiles.length;
});
checkPhoneBtn.addEventListener('click', () => {
  phoneViewState.target = 1;
});
phoneBackBtn.addEventListener('click', () => {
  phoneViewState.target = 0;
});

function clamp01(v) { return Math.max(0, Math.min(1, v)); }

function easeOut(t) {
  // Cubic ease-out: starts immediately fast, decelerates to a smooth stop
  return 1 - Math.pow(1 - t, 3);
}

function lerp(a, b, t) { return a + (b - a) * t; }
let lastTime = performance.now();


// ─── Render Loop ───────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  resizeIfNeeded();
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const raw = clamp01((scrollY - params.scrollStart) /
                      Math.max(1, params.scrollEnd - params.scrollStart));
  const t = easeOut(raw);
  const introOpacity = clamp01(1 - (scrollY / fadeDistance));
  const atEnd = raw >= endTriggerThreshold;

  if (atEnd && !reachedEnd) {
    endRevealState.target = 0;
    playVoice('nastysayings/1.wav', () => {
      if (raw >= endTriggerThreshold) {
        endRevealState.target = 1;
      }
    });
    reachedEnd = true;
  } else if (!atEnd) {
    reachedEnd = false;
    endRevealState.target = 0;
  }

  if (model) {
    // Rotate from π (back) → 0 (front), purely scroll-driven
    model.rotation.y = Math.PI * (1 - t);
    // Vertical offset so user can nudge doll up/down
    model.position.y = params.modelY;
  }

  const isTalking = !!(currentVoiceAudio && !currentVoiceAudio.paused && !currentVoiceAudio.ended);
  let targetMouthOpen = 0;

  if (isTalking) {
    talkPhase += dt * talkParams.speed;
    targetMouthOpen = (Math.sin(talkPhase) * 0.5 + 0.5);

    // Start gently closing near the end of each clip.
    if (Number.isFinite(currentVoiceAudio.duration) && currentVoiceAudio.duration > 0) {
      const progress = currentVoiceAudio.currentTime / currentVoiceAudio.duration;
      const tailClose = clamp01((1 - progress) / 0.05); // 95% -> 100%
      targetMouthOpen *= tailClose;
    }
  }

  // Smooth mouth transitions to avoid abrupt jumps.
  const smooth = 1 - Math.exp(-dt * 18);
  mouthOpenAmount = THREE.MathUtils.lerp(mouthOpenAmount, targetMouthOpen, smooth);
  setMouthOpen(mouthOpenAmount);
  const revealSmooth = 1 - Math.exp(-dt * 6.5);
  endRevealState.value = THREE.MathUtils.lerp(endRevealState.value, endRevealState.target, revealSmooth);
  const viewBlendSmooth = 1 - Math.exp(-dt * phoneViewParams.blendSpeed);
  phoneViewState.blend = THREE.MathUtils.lerp(phoneViewState.blend, phoneViewState.target, viewBlendSmooth);

  // Camera: pull in from startZ → endZ, and rise up toward face
  const baseCameraZ = lerp(params.startZ, params.endZ, t);
  const baseCameraY = lerp(0, params.faceY * 0.35, t); // camera lifts slightly
  camera.position.set(0, baseCameraY, baseCameraZ);

  // Look toward the face: y=0 at start, y=faceY at end
  const lookY = lerp(0, params.faceY, t);
  baseLookTarget.set(0, lookY, 0);

  if (phoneMesh && phoneViewState.blend > 0.001) {
    phoneMesh.updateWorldMatrix(true, false);
    phoneMesh.getWorldPosition(phoneWorldPos);
    phoneNormal.set(0, 0, 1).applyQuaternion(phoneMesh.getWorldQuaternion(new THREE.Quaternion())).normalize();
    phoneCameraPos.copy(phoneWorldPos)
      .addScaledVector(phoneNormal, phoneViewParams.targetDistance)
      .addScaledVector(camera.up, phoneViewParams.riseOffset);
    camera.position.lerp(phoneCameraPos, phoneViewState.blend);
    blendedLookTarget.copy(baseLookTarget).lerp(phoneWorldPos, phoneViewState.blend);
    camera.lookAt(blendedLookTarget);
  } else {
    camera.lookAt(baseLookTarget);
  }

  overlayText.style.opacity = String(introOpacity);
  const revealAlpha = atEnd ? endRevealState.value : 0;
  const squeezeVisibility = phoneViewState.blend < 0.05 ? 1 : 0;
  const phoneBtnVisibility = (phoneViewState.blend < 0.22 && phoneMesh) ? 1 : 0;
  const squeezeAlpha = revealAlpha * squeezeVisibility;
  const phoneBtnAlpha = revealAlpha * phoneBtnVisibility;
  squeezeBtn.style.opacity = String(squeezeAlpha);
  checkPhoneBtn.style.opacity = String(phoneBtnAlpha);
  squeezeBtn.style.pointerEvents = squeezeAlpha > 0.98 ? 'auto' : 'none';
  checkPhoneBtn.style.pointerEvents = phoneBtnAlpha > 0.98 ? 'auto' : 'none';
  phoneBackBtn.classList.toggle('visible', phoneViewState.blend > 0.22);
  phoneFade.style.opacity = String(Math.min(1, Math.max(0, phoneViewState.blend * 1.08)));

  if (phoneMesh) {
    phoneMesh.material.opacity = endRevealState.value;
    phoneMesh.updateWorldMatrix(true, false);
    phoneButtonAnchor.set(0, phoneBaseHeight * 0.55, 0);
    phoneMesh.localToWorld(phoneButtonAnchor);
    phoneButtonAnchor.project(camera);
    const sx = (phoneButtonAnchor.x * 0.5 + 0.5) * canvas.clientWidth;
    const sy = (-phoneButtonAnchor.y * 0.5 + 0.5) * canvas.clientHeight;
    checkPhoneBtn.style.left = `${sx + phoneParams.buttonOffsetX}px`;
    checkPhoneBtn.style.top = `${sy - phoneParams.buttonOffsetY}px`;
  }

  renderer.render(scene, camera);

}

function resizeIfNeeded() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (renderer.domElement.width !== w || renderer.domElement.height !== h) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

animate();

</script>
</body>
</html>
